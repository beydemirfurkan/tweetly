services:
  tweetbot:
    build: .
    image: tweetbot:latest
    container_name: tweetbot
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
      DATA_DIR: /data/app-data
      USER_DATA_DIR: /data/user-data
      X_USERNAME: ${X_USERNAME:-}
      X_AUTH_TOKEN: ${X_AUTH_TOKEN:-}
      X_AUTH_MULTI: ${X_AUTH_MULTI:-}
      X_CT0: ${X_CT0:-}
      X_TWID: ${X_TWID:-}
      X_PASSWORD: ${X_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      HEADLESS: "true"
    ports:
      - "3000:3000"
    volumes:
      - tweetbot_state:/data

  postgres:
    image: postgres:16-alpine
    container_name: tweetly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tweetly}
      POSTGRES_PASSWORD: ${DB_PASS:-tweetly}
      POSTGRES_DB: ${DB_NAME:-tweetly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tweetly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tweetly} -d ${DB_NAME:-tweetly}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tweetbot_state:
  tweetly_pgdata:
