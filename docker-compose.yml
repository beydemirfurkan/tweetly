services:
  tweetly-backend:
    build: ./backend
    image: tweetly-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEST_PORT: "3000"
      X_EXECUTOR_MODE: ${X_EXECUTOR_MODE:-noop}

      # Database
      DATABASE_URL: ${DATABASE_URL:-postgres://tweetly:tweetly@postgres:5432/tweetly}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # Bootstrap-only — set on first deploy, then write secrets.admin_token
      # via PUT /admin/secrets and remove these env vars.
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@tweetly.local}

      # Public URLs the magic-link emails embed and CORS allows.
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Multi-instance coordination (rate-limit + MCP session registry).
      # Leave empty for single-instance deploys.
      REDIS_URL: ${REDIS_URL:-}

      # Server-side X login diagnostics and optional regional egress.
      LOGIN_WORKER_DISABLED: ${LOGIN_WORKER_DISABLED:-false}
      LOGIN_STEP_TIMEOUT_MS: ${LOGIN_STEP_TIMEOUT_MS:-20000}
      LOGIN_NAV_TIMEOUT_MS: ${LOGIN_NAV_TIMEOUT_MS:-45000}
      LOGIN_DEBUG_HEADFUL: ${LOGIN_DEBUG_HEADFUL:-false}
      LOGIN_DEBUG_SLOWMO_MS: ${LOGIN_DEBUG_SLOWMO_MS:-0}
      LOGIN_USER_AGENT: ${LOGIN_USER_AGENT:-}
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - tweetly_state:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tweetly}
      POSTGRES_PASSWORD: ${DB_PASS:-tweetly}
      POSTGRES_DB: ${DB_NAME:-tweetly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tweetly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tweetly} -d ${DB_NAME:-tweetly}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tweetly_state:
  tweetly_pgdata:
