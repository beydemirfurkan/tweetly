services:
  tweetbot:
    build: .
    image: tweetbot:latest
    container_name: tweetbot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Istanbul
      NODE_ENV: production
      NEST_PORT: "3000"
      DATA_DIR: /data/app-data
      USER_DATA_DIR: /data/user-data
      HEADLESS: "true"
      # X Auth
      X_AUTH_TOKEN: ${X_AUTH_TOKEN:-}
      X_USERNAME: ${X_USERNAME:-}
      # AI
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      # Admin
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-tweetly}
      DB_PASS: ${DB_PASS:-tweetly}
      DB_NAME: ${DB_NAME:-tweetly}
    ports:
      - "3000:3000"
    volumes:
      - tweetbot_state:/data

  postgres:
    image: postgres:16-alpine
    container_name: tweetly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tweetly}
      POSTGRES_PASSWORD: ${DB_PASS:-tweetly}
      POSTGRES_DB: ${DB_NAME:-tweetly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tweetly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tweetly} -d ${DB_NAME:-tweetly}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tweetbot_state:
  tweetly_pgdata:
