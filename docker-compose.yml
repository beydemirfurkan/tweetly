services:
  tweetbot:
    build: .
    image: tweetbot:latest
    container_name: tweetbot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEST_PORT: "3000"
      X_EXECUTOR_MODE: ${X_EXECUTOR_MODE:-noop}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      # Database
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-tweetly}
      DB_PASS: ${DB_PASS:-tweetly}
      DB_NAME: ${DB_NAME:-tweetly}
    ports:
      - "3000:3000"
    volumes:
      - tweetbot_state:/data

  postgres:
    image: postgres:16-alpine
    container_name: tweetly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tweetly}
      POSTGRES_PASSWORD: ${DB_PASS:-tweetly}
      POSTGRES_DB: ${DB_NAME:-tweetly}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - tweetly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tweetly} -d ${DB_NAME:-tweetly}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tweetbot_state:
  tweetly_pgdata:
